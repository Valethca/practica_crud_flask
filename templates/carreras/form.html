{% extends "base.html" %}
{% block content %}
<h2>{{ 'Editar Carrera' if carrera and carrera.id else 'Nueva Carrera' }}</h2>
<div class="card p-4 shadow-sm">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre de la Carrera *</label>
            <input type="text" name="nombre" class="form-control" maxlength="100" required value="{{ carrera.nombre if carrera else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" maxlength="255" rows="3">{{ carrera.descripcion if carrera else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('listar_carreras') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
